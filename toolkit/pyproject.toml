[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pets-eval"
version = "1.0.0"
description = "Self-assessment toolkit for the TrustED PETs Transformer challenge (Since AI Hackathon 2026): detection, redaction, privacy-risk and utility scoring."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Since AI ry"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.2"]

[project.scripts]
pets-eval = "pets_eval.cli:main"

[tool.setuptools.packages.find]
include = ["pets_eval*"]
